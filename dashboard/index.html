<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetGuard-AI Gateway Status</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9e1ea;
      --ok: #147d4f;
      --warn: #a15c00;
      --fail: #b42318;
      --ok-bg: #e8f6ef;
      --warn-bg: #fff3d6;
      --fail-bg: #fde8e7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 32px auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .updated {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    button {
      border: 1px solid #1f5f99;
      background: #1f6fb2;
      color: #ffffff;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      min-width: 96px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .summary {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 22px;
      font-weight: 700;
    }

    .checks {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .check {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }

    .check:first-child {
      border-top: 0;
    }

    .badge {
      display: inline-flex;
      justify-content: center;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .OK {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .WARN {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .FAIL {
      background: var(--fail-bg);
      color: var(--fail);
    }

    .message {
      overflow-wrap: anywhere;
    }

    .error {
      border-color: #efb5b0;
      background: #fff8f7;
      color: var(--fail);
      margin-bottom: 16px;
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 20px, 980px);
        margin: 20px auto;
      }

      header {
        display: block;
      }

      button {
        width: 100%;
        margin-top: 14px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .check {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>NetGuard-AI Gateway Status</h1>
        <div class="updated" id="updated">Last updated: never</div>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <section id="error" class="panel error" hidden></section>

    <section class="summary" aria-label="Gateway status summary">
      <div class="panel">
        <div class="label">Final result</div>
        <div class="value" id="final-result">Loading...</div>
      </div>
      <div class="panel">
        <div class="label">Failures</div>
        <div class="value" id="fail-count">-</div>
      </div>
      <div class="panel">
        <div class="label">Warnings</div>
        <div class="value" id="warn-count">-</div>
      </div>
    </section>

    <section class="checks" id="checks" aria-label="Gateway checks"></section>
  </main>

  <script>
    const refreshButton = document.getElementById("refresh");
    const updated = document.getElementById("updated");
    const errorBox = document.getElementById("error");
    const finalResult = document.getElementById("final-result");
    const failCount = document.getElementById("fail-count");
    const warnCount = document.getElementById("warn-count");
    const checks = document.getElementById("checks");

    function setText(element, value) {
      element.textContent = value;
    }

    function showError(message) {
      errorBox.hidden = false;
      setText(errorBox, message);
    }

    function clearError() {
      errorBox.hidden = true;
      setText(errorBox, "");
    }

    function renderChecks(items) {
      checks.innerHTML = "";

      if (!Array.isArray(items) || items.length === 0) {
        const row = document.createElement("div");
        row.className = "check";
        row.textContent = "No checks returned.";
        checks.appendChild(row);
        return;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "check";

        const badge = document.createElement("span");
        const status = String(item.status || "WARN");
        badge.className = `badge ${status}`;
        badge.textContent = status;

        const message = document.createElement("div");
        message.className = "message";
        message.textContent = String(item.message || "");

        row.appendChild(badge);
        row.appendChild(message);
        checks.appendChild(row);
      }
    }

    async function refreshStatus() {
      refreshButton.disabled = true;
      clearError();

      try {
        const response = await fetch("/api/status", {cache: "no-store"});
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `status request failed: ${response.status}`);
        }

        setText(finalResult, data.final_result || "unknown");
        setText(failCount, Number(data.fail_count || 0).toString());
        setText(warnCount, Number(data.warn_count || 0).toString());
        renderChecks(data.checks);
        setText(updated, `Last updated: ${new Date().toLocaleString()}`);
      } catch (error) {
        showError(error.message || "Unable to load gateway status.");
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", refreshStatus);
    refreshStatus();
  </script>
</body>
</html>
